# Cohort config — Infobric pilot, set `pilot-full`.
#
# Built from the partner's pilot pack (Main Brief, five URL briefs, 90-day analytics) so
# that every one of the five audited pages has the audience its brief asks for:
#   1. Homepage            everyone in the pool
#   2. Infobric Fleet      people whose job touches company vehicles
#   3. Electronic Driving Log   the same, where the vehicles are cars, vans or pool cars
#   4. Infobric Equipment  people whose job touches tools and equipment
#   5. Infobric Hyrma      people in the rental process at a rental company
#
# What is new compared with v2 (infobric_managers_v2.yaml):
#   - Four sampling groups instead of one: managers and staff, inside construction and in
#     vehicle or field-service businesses outside it. The briefs list supervisors, drivers,
#     payroll and finance staff, and rental administrators; v2 allowed managers only.
#   - 17 job roles (v2 had 6), drawn conditional on company type AND role family, so a
#     payroll clerk never comes out of the Skilled Trades domain.
#   - Product-situation fields for each page: vehicles, driving logs, tools, rental.
#   - Reason for visit and prior knowledge of Infobric, both asked for in the Main Brief.
#   - Audience fields derived by rule from role and company type. They are written as
#     plain facts about the job, never as page names: the brief says these visitors know
#     little or nothing about Infobric.
#   - Overlays are assigned with exact quotas in a seeded random order
#     (`overlay_assignment: shuffled`), so two stamped fields are independent.
#
# Field ids that start with `_` are build-time helpers and are not written to the pool.
# Consumed by persona/scripts/build_cohort.py. Edit this file, not the script.

name: infobric-pilot-full
display_name: Infobric pilot — full
description: 1,500 Swedish visitors for the Infobric website pilot. Managers and staff across main contractors, subcontractors, developers, rental companies and vehicle or field-service businesses, with explicit roles, responsibilities and product situations for all five audited pages.
seed: 42
total: 1500
draws_per_cell: 10000
max_draws_per_cell: 300000
on_shortfall: borrow
overlay_assignment: shuffled

pinned:
  region: Western Europe
  lang_swedish: Native
  cult_sweden: Native
  cultural_background: Individualist (Western)

# Age is a requirement from the study brief: 17 / 31 / 26 / 20 / 6 % for 25-34 … 65-74.
# Every group uses exactly these shares, so the whole pool matches whatever the group mix.
# Default cells (managers). Staff groups override domain, income and gender below.
cells: &manager_cells
  - dimension: age_bracket
    shares: {"25-34": 17, "35-44": 31, "45-54": 26, "55-64": 20, "65-74": 6}
  - dimension: domain
    shares: {Engineering: 30, Skilled Trades: 35, Business & Management: 25, Finance & Economics: 10}
  - dimension: demo_household_income
    shares: {"$50k-100k": 50, "$100k-200k": 40, "$200k+": 10}
  - dimension: gender_identity          # assumed splits; confirm with the partner
    shares_by: domain
    shares:
      Engineering: {Man: 80, Woman: 20}
      Skilled Trades: {Man: 88, Woman: 12}
      Business & Management: {Man: 60, Woman: 40}
      Finance & Economics: {Man: 50, Woman: 50}

filters:                                  # apply to every group unless a group overrides
  company_size: [Solo / freelance, Startup (<50), SMB (50-500), Mid (500-5k), Enterprise (5k+)]
  domain_characteristics: [Practitioner, Cross-disciplinary, Skeptic / critic]
  english_proficiency: [Native, Fluent (C1-C2), Intermediate (B1-B2), Basic (A1-A2)]

groups:
  - name: construction-managers
    share: 46
    stamp: {_band: Manager, _industry: Construction}
    filters:
      ind_construction: [Veteran, Experienced]
      seniority: [Manager, Director, VP, C-suite, Founder]
      years_experience: ["6-10", "11-20", "20+"]
      demo_employment_status: [Full-time, Self-employed]
      role_function: [Engineering, Operations, Executive, Finance, Sales / GTM]

  - name: construction-staff
    share: 34
    draws_per_cell: 5000
    stamp: {_band: Staff, _industry: Construction}
    filters:
      ind_construction: [Veteran, Experienced]
      seniority: [Entry, Mid, Senior, Lead / Principal]
      demo_employment_status: [Full-time, Part-time]
      role_function: [Engineering, Operations, Finance, Sales / GTM, HR]
    cells: &staff_cells
      - dimension: age_bracket
        shares: {"25-34": 17, "35-44": 31, "45-54": 26, "55-64": 20, "65-74": 6}   # required split, same as managers
      - dimension: domain
        shares: {Skilled Trades: 50, Engineering: 15, Business & Management: 25, Finance & Economics: 10}
      - dimension: demo_household_income
        shares: {"$25k-50k": 25, "$50k-100k": 60, "$100k-200k": 15}
      - dimension: gender_identity
        shares_by: domain
        shares:
          Skilled Trades: {Man: 92, Woman: 8}
          Engineering: {Man: 80, Woman: 20}
          Business & Management: {Man: 35, Woman: 65}
          Finance & Economics: {Man: 30, Woman: 70}

  - name: fieldservice-managers
    share: 11
    stamp: {_band: Manager, _industry: Field service}
    filters:
      ind_transportation: [Veteran, Experienced]
      seniority: [Manager, Director, VP, C-suite, Founder]
      years_experience: ["6-10", "11-20", "20+"]
      demo_employment_status: [Full-time, Self-employed]
      role_function: [Engineering, Operations, Executive, Finance, Sales / GTM]
    cells:
      - dimension: age_bracket
        shares: {"25-34": 17, "35-44": 31, "45-54": 26, "55-64": 20, "65-74": 6}
      - dimension: domain
        shares: {Skilled Trades: 35, Engineering: 20, Business & Management: 35, Finance & Economics: 10}
      - dimension: gender_identity
        shares_by: domain
        shares:
          Engineering: {Man: 80, Woman: 20}
          Skilled Trades: {Man: 88, Woman: 12}
          Business & Management: {Man: 60, Woman: 40}
          Finance & Economics: {Man: 50, Woman: 50}

  - name: fieldservice-staff
    share: 9
    draws_per_cell: 5000
    stamp: {_band: Staff, _industry: Field service}
    filters:
      ind_transportation: [Veteran, Experienced]
      seniority: [Entry, Mid, Senior, Lead / Principal]
      demo_employment_status: [Full-time, Part-time]
      role_function: [Engineering, Operations, Finance, Sales / GTM, HR]
    cells:
      - dimension: age_bracket
        shares: {"25-34": 17, "35-44": 31, "45-54": 26, "55-64": 20, "65-74": 6}   # required split, same as managers
      - dimension: domain
        shares: {Skilled Trades: 55, Business & Management: 30, Finance & Economics: 15}
      - dimension: gender_identity
        shares_by: domain
        shares:
          Skilled Trades: {Man: 92, Woman: 8}
          Business & Management: {Man: 35, Woman: 65}
          Finance & Economics: {Man: 30, Woman: 70}

coherence_rules:
  - name: young-but-20-plus-years
    when: {age_bracket: ["25-34"]}
    forbid: {years_experience: ["20+"]}
  - name: over-35-but-new-to-work
    when: {age_bracket: ["35-44", "45-54", "55-64", "65-74"]}
    forbid: {years_experience: ["0-2"]}
  - name: under-45-empty-nester-or-retired
    when: {age_bracket: ["18-24", "25-34", "35-44"]}
    forbid: {life_stage: [Empty nester, Retirement]}
  - name: working-but-retired-life-stage
    when: {}
    forbid: {life_stage: [Retirement]}
  - name: working-but-student
    when: {}
    forbid: {life_stage: [Student]}
  - name: old-but-early-career
    when: {age_bracket: ["55-64", "65-74"]}
    forbid: {life_stage: [Early career]}
  - name: employed-but-low-income-band
    when: {}
    forbid: {socioeconomic_band: [Low income]}
  - name: freelance-but-full-time-employee
    when: {company_size: [Solo / freelance]}
    forbid: {demo_employment_status: [Full-time, Part-time]}
  - name: staff-cannot-be-a-one-person-company
    when: {_band: [Staff]}
    forbid: {company_size: [Solo / freelance]}
  - name: founder-at-large-company-is-rare
    when: {seniority: [Founder]}
    forbid: {company_size: [Enterprise (5k+), Mid (500-5k)]}
  - name: trades-or-engineering-but-office-function
    when: {domain: [Skilled Trades, Engineering]}
    forbid: {role_function: [Finance, Sales / GTM, HR]}
  - name: business-or-finance-but-engineering-function
    when: {domain: [Business & Management, Finance & Economics]}
    forbid: {role_function: [Engineering]}

# Role family decides which job roles are possible. It comes from the sampled domain, so
# the role always fits the person's background.
derived:
  - id: _family
    stage: before_overlays
    rules:
      - when: {_band: [Manager], domain: [Engineering, Skilled Trades]}
        value: Operational manager
      - when: {_band: [Manager]}
        value: Business manager
      - when: {_band: [Staff], domain: [Engineering, Skilled Trades]}
        value: Field staff
    default: Office staff

  # --- after overlays: the partner's six visitor kinds (Main Brief section 4) ----------
  - id: audience_group
    label: Kind of visitor
    rules:
      - when: {job_role: [Executive or owner]}
        value: Owner or senior manager
      - when: {job_role: [Site or project manager, Operations manager]}
        value: Operations, project or site manager
      - when: {job_role: [Fleet or vehicle manager, Machine or equipment manager, Tool or asset manager, Rental or depot manager, Service or maintenance manager]}
        value: Fleet, equipment or rental manager
      - when: {job_role: [Finance or administration manager, Procurement manager, Finance or payroll staff, Rental sales or administrator]}
        value: Finance or administration
      - when: {job_role: [HSEQ manager, HSE or compliance coordinator]}
        value: HSE or compliance
    default: Supervisor or daily user

  # --- page audiences, written as facts about the job (never as page names) ------------
  - id: deals_with_vehicles            # Infobric Fleet
    label: Company vehicles at work
    rules:
      - when: {job_role: [Fleet or vehicle manager, Transport or logistics coordinator, Driver or field worker, Finance or administration manager, Finance or payroll staff, Executive or owner, Operations manager, Supervisor or foreman]}
        value: Part of my job
      - when: {resp_vehicles_fleet: [Owns]}
        value: Part of my job
    default: Not part of my job
  - id: deals_with_driving_logs        # Electronic Driving Log
    label: Driving logs and mileage claims at work
    rules:
      - when:
          deals_with_vehicles: [Part of my job]
          vehicle_use: [Service vans and pickups, Company cars with private use, Pool cars shared by staff, Mixed fleet]
        value: Part of my job
    default: Not part of my job
  - id: deals_with_tools_equipment     # Infobric Equipment
    label: Keeping track of tools and equipment at work
    rules:
      - when: {job_role: [Tool or asset manager, Machine or equipment manager, Site or project manager, Operations manager, Executive or owner, Procurement manager, Finance or administration manager, Supervisor or foreman, Driver or field worker, Service or maintenance manager, Rental or depot manager]}
        value: Part of my job
      - when: {resp_tools_assets: [Owns]}
        value: Part of my job
    default: Not part of my job
  - id: works_in_rental_process        # Infobric Hyrma
    label: Rental process (bookings, returns, invoicing) at work
    rules:
      - when:
          tier: [Rental]
          job_role: [Executive or owner, Rental or depot manager, Operations manager, Rental sales or administrator, Service or maintenance manager, Transport or logistics coordinator, Finance or administration manager, Finance or payroll staff]
        value: Part of my job
    default: Not part of my job

