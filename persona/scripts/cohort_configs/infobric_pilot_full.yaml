# Applied after overlays and derived fields, in order. `when` lists the values that trigger
# the change, so a floor reads "when below the floor, set to the floor".
overrides:
  # --- generic clean-up: fields the sampler leaves inconsistent with age and nationality --
  - name: generation-fits-age-18-24
    when: {age_bracket: ["18-24"], demo_generation: [Gen Alpha, Millennial, Gen X, Boomer, Silent]}
    set: {demo_generation: Gen Z}
  - name: generation-fits-age-25-34
    when: {age_bracket: ["25-34"], demo_generation: [Gen Alpha, Gen X, Boomer, Silent]}
    set: {demo_generation: Millennial}
  - name: generation-fits-age-35-44
    when: {age_bracket: ["35-44"], demo_generation: [Gen Alpha, Gen Z, Gen X, Boomer, Silent]}
    set: {demo_generation: Millennial}
  - name: generation-fits-age-45-54
    when: {age_bracket: ["45-54"], demo_generation: [Gen Alpha, Gen Z, Millennial, Boomer, Silent]}
    set: {demo_generation: Gen X}
  - name: generation-fits-age-55-64
    when: {age_bracket: ["55-64"], demo_generation: [Gen Alpha, Gen Z, Millennial, Silent]}
    set: {demo_generation: Gen X}
  - name: generation-fits-age-65-74
    when: {age_bracket: ["65-74"], demo_generation: [Gen Alpha, Gen Z, Millennial, Gen X, Silent]}
    set: {demo_generation: Boomer}
  - name: swedish-native-is-a-citizen
    when: {demo_citizenship_status: [Visa holder, Undocumented]}
    set: {demo_citizenship_status: Citizen by birth}
  - name: swedish-plus-english-is-bilingual
    when: {multilingualism: [Monolingual]}
    set: {multilingualism: Bilingual}
  - name: band-matches-income-25k-50k
    when: {demo_household_income: ["$25k-50k"], socioeconomic_band: [Upper-middle, High income]}
    set: {socioeconomic_band: Lower-middle}
  - name: band-matches-income-100k-200k
    when: {demo_household_income: ["$100k-200k"], socioeconomic_band: [Low income, Lower-middle]}
    set: {socioeconomic_band: Middle}
  - name: band-matches-income-200k-plus
    when: {demo_household_income: ["$200k+"], socioeconomic_band: [Low income, Lower-middle, Middle]}
    set: {socioeconomic_band: Upper-middle}
  # The brief asks for desktop and mobile review, so keep the device field to those two.
  - name: device-staff-is-mobile
    when: {_band: [Staff], device_context: [Low-bandwidth, Voice assistant, Accessibility tool]}
    set: {device_context: "Mobile, on-the-go"}
  - name: device-manager-is-desktop
    when: {_band: [Manager], device_context: [Low-bandwidth, Voice assistant, Accessibility tool]}
    set: {device_context: "Desktop, focused"}

  # subject_specialty must fit the domain (v1 had Engineering managers "focused on Cardiology")
  - name: specialty-fits-engineering
    when: {domain: [Engineering], subject_specialty: [Machine learning, Cardiology, Constitutional law, Quant trading, Curriculum design, Molecular biology, Behavioral economics, Comparative literature, Agronomy, Investigative reporting, Culinary arts, Electrical work]}
    set: {subject_specialty: Structural engineering}
  - name: specialty-fits-skilled-trades
    when: {domain: [Skilled Trades], subject_specialty: [Machine learning, Cardiology, Constitutional law, Quant trading, Curriculum design, Molecular biology, Behavioral economics, Comparative literature, Agronomy, Investigative reporting, Culinary arts, Robotics, Urban planning, Structural engineering]}
    set: {subject_specialty: Electrical work}
  - name: specialty-fits-business-and-finance
    when: {domain: [Business & Management, Finance & Economics], subject_specialty: [Machine learning, Cardiology, Constitutional law, Quant trading, Curriculum design, Molecular biology, Behavioral economics, Comparative literature, Agronomy, Investigative reporting, Culinary arts, Robotics, Electrical work, Structural engineering, Urban planning]}
    set: {subject_specialty: Operations}

  # --- the job function and seniority must fit the stamped role --------------------------
  - name: executive-role-function
    when: {job_role: [Executive or owner], role_function: [Engineering, Operations, Finance, Sales / GTM]}
    set: {role_function: Executive}
  - name: executive-is-at-least-director
    when: {job_role: [Executive or owner], seniority: [Manager]}
    set: {seniority: Director}
  - name: finance-roles-are-finance-function
    when: {job_role: [Finance or administration manager, Finance or payroll staff], role_function: [Operations, Executive, Sales / GTM]}
    set: {role_function: Finance}
  - name: rental-sales-is-sales-function
    when: {job_role: [Rental sales or administrator], role_function: [Operations, Finance, HR, Engineering]}
    set: {role_function: Sales / GTM}
  - name: operational-roles-are-operations-function
    when:
      job_role: [HSEQ manager, Fleet or vehicle manager, Machine or equipment manager, Tool or asset manager, Rental or depot manager, Service or maintenance manager, Operations manager, Procurement manager, Transport or logistics coordinator, HSE or compliance coordinator, Supervisor or foreman, Driver or field worker]
      role_function: [Executive, Finance, Sales / GTM, HR]
    set: {role_function: Operations}
  - name: supervisor-is-not-entry-level
    when: {job_role: [Supervisor or foreman], seniority: [Entry]}
    set: {seniority: Senior}

  # --- knowledge floors: construction people know the basics of the trade ----------------
  - name: floor-pm-aware
    when: {_industry: [Construction], fam_project_management: ["None"]}
